<!DOCTYPE html>
<html>
<head>
  <title>Access Granted</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #e8f5ff;
      font-family: Segoe UI, Arial, sans-serif;
      overflow: hidden; /* Prevent scrolling */
    }

    /* Centered Access Granted message */
    #access {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 42px;
      font-weight: 700;
      color: #0078d4;
      text-align: center;
      opacity: 1;
      transition: opacity 0.5s ease;
    }

    #emailImage {
  display: none;
  width: 100vw;
  height: 100vh;
  object-fit: contain;   /* prevents stretching */
  background: black;     /* fills empty space */
  animation: fadeIn 1s ease forwards;
}
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>

<body>

  <!-- Access Granted message -->
  <div id="access">Access Granted</div>

  <!-- Fullscreen image -->
  <img id="emailImage" src="MailHomePage.png" alt="Email Screen">

  <script>
    // After 1 second, hide text and show image
    setTimeout(() => {
      document.getElementById("access").style.opacity = 0;

      setTimeout(() => {
        document.getElementById("access").style.display = "none";
        document.getElementById("emailImage").style.display = "block";
      }, 500); // Wait for fade-out before showing image

    }, 1000); // 1 second loading time
  </script>

</body>
</html>
